<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duel Dash</title><link rel="stylesheet" href="style.css"></head><body><main>
<section id="lobby" class="card"><div class="logo">⚡ Duel Dash</div><p class="tag">Two players. One arena. Grab the targets first.</p><label>Your name<input id="name" maxlength="16" placeholder="Player 1"></label><div class="actions"><button id="create">Create room</button><button id="showJoin" class="ghost">Join room</button></div><div id="joinBox" class="hidden"><label>Room code<input id="code" maxlength="6" placeholder="ABC123"></label><button id="join">Join game</button></div><div class="rules"><b>Rules</b><span>60 seconds • Each target = 1 point • Highest score wins</span></div><p id="msg"></p></section>
<section id="room" class="card hidden"><div class="top"><div><div class="eyebrow">ROOM CODE</div><div id="roomCode" class="code">------</div></div><button id="start">Start match</button></div><div class="players"><div id="p1" class="player"><span>Player 1</span><b>0</b></div><div id="p2" class="player"><span>Waiting…</span><b>0</b></div></div><p id="wait">Share the room code with your opponent.</p><button id="copy" class="ghost">Copy room code</button></section>
<section id="game" class="hidden"><div class="hud"><div class="pill">⏱ <b id="time">60</b></div><div class="score"><span id="meName">You</span> <b id="meScore">0</b> · <span id="oppName">Opponent</span> <b id="oppScore">0</b></div></div><div id="arena"><button id="target" aria-label="Target">+</button><div id="flash"></div></div><p class="tip">Tap the target as soon as it appears!</p></section>
<section id="result" class="card hidden"><div class="logo">🏁 Match over</div><h1 id="winner">Great game!</h1><div id="finalScores"></div><button id="again">Back to lobby</button></section>
</main><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
